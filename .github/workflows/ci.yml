name: CI

on:
  push:
    branches: [main, fix/ci-workflow]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search for secrets
        run: |
          if grep -r "ghp_\|gho_\|github_pat_\|Bearer " --include="*.ts" --include="*.js" --include="*.json" . 2>/dev/null; then
            echo "ERROR: Potential secret found in code!"
            exit 1
          else
            echo "No obvious secrets found in code files."
          fi

concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true
